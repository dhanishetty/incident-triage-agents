server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Used by the Docker healthcheck
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Vite fingerprints these filenames, so browsers can keep them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page itself must always be revalidated, or browsers keep an old index.html that points at old assets
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # The Triage API. The address is looked up per request (127.0.0.11 is Docker's DNS), so the site still starts
    # if the backend is down. Buffering is off so server-sent events reach the browser as they happen.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
