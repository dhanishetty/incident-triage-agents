server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Used by the Docker healthcheck
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Vite fingerprints these filenames, so browsers can keep them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page itself must always be revalidated, or browsers keep an old index.html that points at old assets
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Later: location /api/ { proxy_pass http://triage-api:8000/; } once the Triage API exists
}
